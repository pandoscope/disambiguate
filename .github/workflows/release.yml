# Version-driven releases (docs/releasing.md): merging a PR that bumps
# `project.version` IS the release. The gate compares the version on
# main against the pushed tags; when the tag already exists every
# publish job no-ops, so doc-only pushes to main stay silent. Nothing
# here pushes to main, so the org's rulesets (pull request, ci-ok,
# signatures) never see a bot commit (meta#155, #86). PyPI
# authenticates the workflow itself via OIDC trusted publishing.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: "version gate"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The lockstep test guards version agreement on every PR; the gate
      # re-checks at the moment it matters so a wheel can never be
      # published under the wrong version.
      - name: pyproject.toml and the module carry the same unpublished version
        id: decide
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module="$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/disambiguate/__init__.py").read()).group(1))')"
          if [ "$module" != "$version" ]; then
            echo "::error::src/disambiguate/__init__.py carries $module but pyproject.toml carries $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  pypi:
    name: "publish to PyPI"
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The `pypi` environment carries required reviewers: the upload waits
    # for a human. PyPI's trusted publisher references this environment
    # and this workflow file.
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # --check-url makes re-runs idempotent: files already on the index
      # are skipped instead of failing the upload.
      - name: Build and publish the wheel and sdist
        run: |
          set -euo pipefail
          uv build
          uv publish --check-url https://pypi.org/simple/disambiguate/

  release:
    name: "tag + GitHub release"
    needs: [gate, pypi]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # The bundle script runs `python3.12 -m pip download`; the runner
      # image promises neither that interpreter nor pip in it.
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Build the wheel, the sdist and the Claude bundle
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: make "dist/disambiguate-v${VERSION}-claude-bundle.zip"

      - name: Tag the published version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            dist/*.whl dist/*.tar.gz "dist/disambiguate-v${VERSION}-claude-bundle.zip"
