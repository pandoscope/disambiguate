name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: j178/prek-action@v2.0.2

  # Make sure commit messages follow the conventional commits convention:
  # https://www.conventionalcommits.org
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6.2.1

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          # - "3.10"
          # - "3.11"
          # - "3.12"
          - "3.13"
          # - "3.14"
        os:
          - ubuntu-latest
          # - windows-latest
          # - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-python-downloads
        shell: bash
      - run: uv run pytest tests
        shell: bash

  # Runs the tool against this repository's own glossary and prose. The
  # unit suite proves the checks work on fixtures; this proves they hold
  # on the real corpus, which is the only place drift actually appears.
  # `--drift` is read-only (adr 0002), so nothing here writes back.
  dogfood:
    name: "dogfood (lint + drift)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      # setup-uv pins UV_PYTHON but installs no interpreter, and the sync
      # below forbids downloading one — so the Python comes from here, as
      # in the test job.
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
      - run: uv sync --no-python-downloads
        shell: bash
      - run: make dogfood
        shell: bash
