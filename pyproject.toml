[build-system]
build-backend = "hatchling.build"
# DECISION:ARCH — hatch-fancy-pypi-readme is a build-time-only dependency;
# the installed package stays stdlib-only (project.dependencies is empty).
requires = [ "hatch-fancy-pypi-readme>=24.1", "hatchling>=1.27" ]

[project]
name = "disambiguate"
version = "0.4.0"
description = """\
  A tool to resolve markdown glossary terms and their transitive dependencies in topological order in a GitHub project \
  or Obsidian vault.\
  """
license = "MIT"
authors = [
  { name = "Frankify", email = "creator@frankify.app" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
# DECISION:ARCH — readme is dynamic: the checked-in README.md keeps relative
# links (editors, GitHub, lint root); hatch-fancy-pypi-readme rewrites them to
# absolute GitHub URLs in the built package metadata so they work on PyPI (#15).
dynamic = [ "readme" ]
dependencies = []
urls."Bug Tracker" = "https://github.com/pandoscope/disambiguate/issues"
urls.documentation = "https://disambiguate.readthedocs.io"
urls.repository = "https://github.com/pandoscope/disambiguate"
scripts.disambiguate = "disambiguate.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.8,<2",
  "pytest==9.*",
  "pytest-cov==7.*",
  "ruff>=0.6",
  "typer>=0.23.1",
]

[tool.hatch]
build.hooks.custom.path = "hatch_build.py"
build.targets.sdist.include = [
  "src/disambiguate",
  "docs/glossary",
  "README.md",
  "LICENSE",
]
build.targets.wheel.packages = [ "src/disambiguate" ]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
# Rewrite relative markdown link targets to absolute GitHub URLs; targets that
# already carry a URI scheme (https://, mailto:, ...) or are in-page anchors (#)
# are left untouched.
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = "\\[([^\\]]+)\\]\\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#)([^)]+)\\)", replacement = "[\\1](https://github.com/pandoscope/disambiguate/blob/main/\\2)" },
]

[tool.ruff]
line-length = 88
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."hatch_build.py" = [ "D" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "E501", # long lines OK in test data
  "S101", # asserts are fine in tests
  "S108", # /tmp Path placeholders never touch the filesystem
]
lint.per-file-ignores."tests/unit/test_dunder_main.py" = [ "S603" ]
# Template-vendored (agentic-engineering-template) — managed duplication,
# linted under the template's own config. Local strict-rule debt tracked in
# pandoscope/agentic-engineering-template#55.
lint.per-file-ignores."tools/**/*" = [ "B904", "D", "S603", "S607" ]
lint.isort.known-first-party = [ "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
python_version = "3.12"
strict = true
files = [ "src", "tests", "dev_cli.py" ]

[tool.pytest]
ini_options.minversion = "9.0"
ini_options.addopts = [
  "-Wonce",
  "-p no:doctest",
]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.disambiguate]
# The stamped record-contract term mentions this repo's own `slug` term
# without linking it; the file is template-owned (never edited here),
# so the finding is scoped away instead (agentic-engineering-template#198).
drift-ignore-paths = { "docs/glossary/record-contract.md" = [ "unlinked-term" ] }
